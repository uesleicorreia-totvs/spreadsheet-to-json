name: Deploy API Spreadsheet to JSON

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Debug - Verificar trigger
      run: echo "Workflow disparado por push na branch main"

    - name: Deploy via SSH na OCI
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          cd /home/${{ secrets.SSH_USER }}/apps/fini/spreadsheet-to-json
          git checkout main
          git pull origin main
          docker compose down
          docker compose up -d --build
          docker image prune -f

    - name: Deploy concluído
      run: echo "Deploy executado com sucesso"