version: '3.8'

services:
  api:
    build: .
    container_name: descarga-api
    ports:
      - "8082:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: python api.py
    # Para desenvolvimento com reload automático, descomente a linha abaixo:
    # command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
